[build-system]
# >=83.0.0, not the template's >=75.0: PYSEC-2026-3447 affects setuptools before 83.0.0,
# and the dependency audit fails on any environment that resolves an earlier one.
requires = ["setuptools>=83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "software-update-publisher"
version = "0.1.0"
description = "Monitors upstream vendors for new Windows software releases, verifies each artifact, publishes it to the application repository, and emits a release document."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "boto3>=1.34,<2",
    "httpx>=0.27,<1",
    "pydantic>=2.0,<3",
    "pydantic-settings>=2.0,<3",
]

[project.optional-dependencies]
dev = [
    "build",
    # Named explicitly so the audited environment cannot resolve a version with
    # PYSEC-2026-3447; build backends and tooling otherwise pull in whatever they like.
    "setuptools>=83.0.0",
    "boto3-stubs[s3]",
    "codespell==2.4.1",
    "mypy==1.16.0",
    "pip-audit",
    "pre-commit",
    "pytest",
    "pytest-cov",
    "ruff==0.11.12",
    "twine",
    "validate-pyproject==0.24",
]

[project.scripts]
software-update-publisher = "software_update_publisher.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["software_update_publisher*"]

[tool.setuptools.package-data]
software_update_publisher = ["py.typed"]

[tool.ruff]
target-version = "py311"
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "S", "SIM", "C4", "PT", "T20", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
# tools/ is deliberately absent from [tool.ruff].src: those files are synced from the
# type-template and linted there. Formatting them here would diverge from the template and be
# reverted by the next sync.

[tool.mypy]
python_version = "3.11"
strict = true

[[tool.mypy.overrides]]
# pymsi is pinned at a pre-release and ships no type information. The conformance test in
# tests/test_identity.py is what actually guards its output.
module = ["pymsi.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-ra --import-mode=importlib --cov=src --cov-report=term-missing --cov-fail-under=90"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.codespell]
# "re-declaring" appears in a synced org decision record, which is not edited here.
ignore-words-list = "re-declaring"
skip = ".venv,dist,*.egg-info,.git,.mypy_cache,.pytest_cache,.ruff_cache"
