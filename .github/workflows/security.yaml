name: Security

# One visible security entrypoint. The detailed implementations stay in namespace-local reusable
# workflows in nwarila-platform/.github so consumers pin the same checks by SHA.

on:
  branch_protection_rule:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
  schedule:
    - cron: "0 8 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  codeql:
    name: CodeQL
    permissions:
      contents: read # required by the reusable CodeQL workflow to inspect repository content
      security-events: write # required to upload CodeQL SARIF
      actions: read # required by CodeQL upload-sarif to associate results with the run
    uses: nwarila-platform/.github/.github/workflows/reusable-codeql.yaml@49b9084988d2bb64d14f0ed2a81453a3435b935d # nwarila-platform/.github main @ 2026-09-18

  scorecard:
    name: OpenSSF Scorecard
    if: ${{ github.event_name != 'pull_request' && github.event_name != 'merge_group' }}
    permissions:
      security-events: write # required to upload Scorecard SARIF
      id-token: write # required by OpenSSF Scorecard tokenless attestation
      actions: read # required by code-scanning upload metadata
      contents: read # required by Scorecard repository checks
    uses: nwarila-platform/.github/.github/workflows/reusable-scorecard.yaml@49b9084988d2bb64d14f0ed2a81453a3435b935d # nwarila-platform/.github main @ 2026-09-18
